<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; form-action 'self' https://formspree.io; connect-src 'self' https://*.supabase.co; base-uri 'self'; object-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password | Unbound Academics</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<header>
  <nav class="nav">
    <a href="index.html" class="logo"><img src="logo.jpg" alt="" class="logo-mark">Unbound <em>Academics</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
    </ul>
  </nav>
</header>

<div class="hero" style="padding:84px 0 96px;">
  <div class="wrap" style="grid-template-columns:1fr;">
    <div>
      <span class="eyebrow">Accounts</span>
      <h1 style="font-size:clamp(2.4rem,4.8vw,3.6rem);">Set a new <span class="hl">password.</span></h1>
      <p class="lead" id="page-sub">Checking your reset link…</p>
    </div>
  </div>
</div>

<section>
  <div class="wrap" style="max-width:460px;">

    <div id="invalid-link" class="card rv" style="padding:44px;text-align:center;display:none;">
      <h3 style="margin-bottom:14px;">This link is invalid or expired</h3>
      <p style="color:var(--gray);margin-bottom:28px;">Password reset links only work once and expire after a while. Request a new one below.</p>
      <a href="forgot-password.html" class="btn btn-gold" style="justify-content:center;">Request a New Link →</a>
    </div>

    <form id="reset-form" class="card rv" style="display:none;display:grid;gap:18px;">
      <div id="reset-msg" class="form-msg"></div>
      <div><label style="font-weight:700;font-size:.9rem;display:block;margin-bottom:6px;">New password</label><input type="password" id="password" required minlength="8" style="width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:10px;font:inherit;"><p style="font-size:.8rem;color:var(--gray);margin-top:6px;">At least 8 characters.</p></div>
      <button type="submit" id="reset-btn" class="btn btn-gold" style="border:none;cursor:pointer;font:inherit;font-weight:800;justify-content:center;">Set New Password →</button>
    </form>

  </div>
</section>

<script src="supabase.js"></script>
<script src="auth.js"></script>
<script>
let recoveryReady = false;

if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
      document.getElementById('page-sub').textContent = 'Enter a new password below.';
      document.getElementById('reset-form').style.display = 'grid';
    }
  });
}

setTimeout(() => {
  if (!recoveryReady) {
    document.getElementById('page-sub').textContent = '';
    document.getElementById('invalid-link').style.display = 'block';
  }
}, 3000);

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('reset-msg');
  const btn = document.getElementById('reset-btn');
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Saving…';

  const { error } = await updatePassword(password);

  btn.disabled = false;
  btn.textContent = 'Set New Password →';

  if (error) {
    showMsg(msg, friendlyError(error), 'error');
    return;
  }

  showMsg(msg, 'Password updated. Taking you to your account…', 'success');
  setTimeout(() => { window.location.href = 'account.html'; }, 1500);
});
</script>
</body>
</html>
